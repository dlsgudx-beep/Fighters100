name: Build Fighters100 APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Fighters100_107_GitHub_Upload.zip'
      - '.github/workflows/build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract project
        run: unzip -o Fighters100_107_GitHub_Upload.zip -d .
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fighters100_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
